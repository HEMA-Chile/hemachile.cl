<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>HEMA Chile – Esgrima Histórica en Chile | Reconocimiento deportivo y clubes</title>

    <meta
      name="description"
      content="HEMA Chile es una agrupación de clubes de esgrima histórica de tradición europea (HEMA) de alcance nacional. Conoce la solicitud de reconocimiento de HEMA como modalidad deportiva y encuentra sus clubes y clases de espada larga, ropera, sable militar y más en Santiago, Temuco, Copiapó, Valdivia, Puerto Montt y Valparaíso. Horarios, direcciones, contactos y redes sociales."
    />
    <meta
      name="keywords"
      content="HEMA Chile, esgrima histórica, esgrima medieval, esgrima renacentista, academias de esgrima en Chile, espada larga, sable militar, ropera, broquel, Santiago, Temuco, Valdivia, Copiapó, Puerto Montt, Valparaíso"
    />
    <meta name="author" content="HEMA Chile" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
    <meta property="og:title" content="HEMA Chile – Esgrima Histórica en Chile" />
    <meta
      property="og:description"
      content="Mapa de los clubes de HEMA Chile: horarios, direcciones, contactos, especialidades y redes sociales."
    />
    <meta property="og:url" content="https://hemachile.cl/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://hemachile.cl/icons/path1.png" />
    <meta property="og:site_name" content="HEMA Chile" />
    <meta property="og:locale" content="es_CL" />
    <meta property="article:publisher" content="https://www.facebook.com/hemachile/" />

    <link rel="canonical" href="https://hemachile.cl/" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Aplica el tema guardado antes de pintar, para evitar un parpadeo -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

    <!-- Datos estructurados: se generan automáticamente desde src/data/clubes.ts -->
    <!--JSON_LD-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
