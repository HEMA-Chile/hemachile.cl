<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--SEO: scripts/prerender.mjs reemplaza este bloque en cada página (ver src/seo.ts)-->
    <title>HEMA Chile – Esgrima histórica y reconocimiento deportivo</title>
    <meta
      name="description"
      content="Clubes de HEMA y HEMA Chile solicitan al Ministerio del Deporte reconocer la esgrima histórica europea (HEMA) como modalidad deportiva en Chile."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://hemachile.cl/" />
    <meta property="og:title" content="HEMA Chile – Esgrima histórica y reconocimiento deportivo" />
    <meta
      property="og:description"
      content="Clubes de HEMA y HEMA Chile solicitan al Ministerio del Deporte reconocer la esgrima histórica europea (HEMA) como modalidad deportiva en Chile."
    />
    <meta property="og:url" content="https://hemachile.cl/" />
    <!--/SEO-->

    <meta name="author" content="HEMA Chile" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph (Facebook / WhatsApp / LinkedIn) y X -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HEMA Chile" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="https://hemachile.cl/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HEMA Chile: esgrima histórica europea en Chile, con los logos de sus clubes" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Aplica el tema guardado antes de pintar, para evitar un parpadeo -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

    <!-- Datos estructurados: se generan automáticamente desde src/data/clubes.ts -->
    <!--JSON_LD-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
